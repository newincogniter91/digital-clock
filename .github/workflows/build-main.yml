name: Build DigitalClock (main — multi-OS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Linux x86 64-bit (nativo) ──────────────────────────────
  linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze x86_64
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential pkg-config libsdl2-dev libcurl4-openssl-dev

      - name: Compila x86_64
        run: make linux64

      - name: Compila x86_32 in container nativo 32-bit
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD:/src" -w /src \
            i386/ubuntu:24.04 bash -lc '
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && \
              make linux32
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86
          path: |
            clock_linux64
            clock_linux32

  # ── Linux ARM 64-bit + 32-bit (container nativi, non multiarch APT) ──────
  linux-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compila ARM64 in container nativo
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src \
            arm64v8/ubuntu:24.04 bash -lc '
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && \
              make linux-arm64
            '

      - name: Compila ARM32 in container nativo
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src \
            arm32v7/ubuntu:24.04 bash -lc '
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && \
              make linux-arm32
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm
          path: |
            clock_linux_arm64
            clock_linux_arm32

  # ── Windows (64-bit + 32-bit, via MSYS2) ───────────────────
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            output: clock64.exe
            target: windows64
          - msystem: MINGW32
            prefix: mingw-w64-i686
            output: clock32.exe
            target: windows32
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-SDL2
            ${{ matrix.prefix }}-curl

      - name: Compila ${{ matrix.output }}
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.msystem }}
          path: ${{ matrix.output }}