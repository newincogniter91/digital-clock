name: Build DigitalClock (main — multi-OS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Linux x86 64-bit (nativo) ──────────────────────────────
  linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze x86_64
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential pkg-config libsdl2-dev libcurl4-openssl-dev

      - name: Set up QEMU (for i386 container emulation)
        uses: docker/setup-qemu-action@v3

      - name: Compila x86_64 e x86_32 in parallelo (container per i386)
        run: |
          set -e
          mkdir -p build-logs
          echo "Start linux64 build"
          (make linux64 > build-logs/linux64.log 2>&1) &
          pid64=$!

          echo "Start linux32 build in 32-bit container"
          docker run --rm --platform linux/386 \
            -v "$PWD:/src" -w /src \
            i386/debian:bookworm bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && make linux32" > build-logs/linux32.log 2>&1 &
          pid32=$!

          wait $pid64; rc64=$?
          wait $pid32; rc32=$?
          echo "linux64 rc=$rc64"; echo "linux32 rc=$rc32"

          # Show logs for debugging if something failed
          if [ $rc64 -ne 0 ]; then echo "--- linux64 log ---"; cat build-logs/linux64.log; fi
          if [ $rc32 -ne 0 ]; then echo "--- linux32 log ---"; cat build-logs/linux32.log; fi

          # Exit non-zero only if both builds failed
          if [ $rc64 -ne 0 ] && [ $rc32 -ne 0 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86
          path: |
            clock_linux64
            clock_linux32

  # ── Linux ARM 64-bit + 32-bit (container nativi, non multiarch APT) ──────
  linux-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compila ARM64 e ARM32 in parallelo (container nativi)
        run: |
          set -e
          mkdir -p build-logs

          echo "Start linux-arm64 build in container"
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src \
            arm64v8/ubuntu:24.04 bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && make linux-arm64" > build-logs/arm64.log 2>&1 &
          pid_arm64=$!

          echo "Start linux-arm32 build in container"
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src \
            arm32v7/ubuntu:24.04 bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libsdl2-dev libcurl4-openssl-dev && make linux-arm32" > build-logs/arm32.log 2>&1 &
          pid_arm32=$!

          wait $pid_arm64; rc_arm64=$?
          wait $pid_arm32; rc_arm32=$?
          echo "arm64 rc=$rc_arm64"; echo "arm32 rc=$rc_arm32"

          if [ $rc_arm64 -ne 0 ]; then echo "--- arm64 log ---"; cat build-logs/arm64.log; fi
          if [ $rc_arm32 -ne 0 ]; then echo "--- arm32 log ---"; cat build-logs/arm32.log; fi

          if [ $rc_arm64 -ne 0 ] && [ $rc_arm32 -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm
          path: |
            clock_linux_arm64
            clock_linux_arm32

  # ── Windows (64-bit + 32-bit, via MSYS2) ───────────────────
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            output: clock64.exe
            target: windows64
          - msystem: MINGW32
            prefix: mingw-w64-i686
            output: clock32.exe
            target: windows32
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-SDL2
            ${{ matrix.prefix }}-curl

      - name: Compila ${{ matrix.output }}
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.msystem }}
          path: ${{ matrix.output }}